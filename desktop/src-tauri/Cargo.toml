[package]
name = "texgo-desktop"
version = "0.3.1"
description = "A local LaTeX image workbench"
authors = ["yaho"]
edition = "2021"
license = "MIT"
default-run = "texgo-desktop"

[lib]
name = "texgo_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "texgo-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "texgo-engine"
path = "src/bin/texgo-engine.rs"
required-features = ["automation"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-notification", "dep:tauri-plugin-opener", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-updater"]
automation = []
updater-tests = ["desktop", "tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
base64 = "0.22"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp", "webp"] }
img-parts = "0.4"
kamadak-exif = "0.6"
lopdf = "0.38"
png = "0.18"
pathdiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
svg2pdf = "0.13"
resvg = { version = "0.45.1", default-features = false, features = ["raster-images", "text"] }
tempfile = "3"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }

tauri-plugin-global-shortcut = { version = "2.4.1", optional = true }
tauri-plugin-notification = { version = "2.7.0", optional = true }
notify = "8.2.0"
cap-std = "3"
cap-fs-ext = "3"
tauri-plugin-updater = { version = "2", optional = true }

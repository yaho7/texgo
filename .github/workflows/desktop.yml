name: Desktop

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Verify frontend and engine
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Validate desktop dependency lock
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-cargo-lock
          path: desktop/src-tauri/Cargo.lock
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:pdf
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features automation

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: verify
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-14
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-14
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            bundles: dmg
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: package-${{ matrix.target }}
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - name: Install frontend dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: resolved-cargo-lock
          path: desktop/src-tauri
      - name: Build bundled engine and prepare icons
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --locked --no-default-features --features automation --bin texgo-engine --target "$TARGET"
          extension=''
          if [ "$RUNNER_OS" = Windows ]; then extension='.exe'; fi
          mkdir -p src-tauri/binaries
          cp "src-tauri/target/$TARGET/release/texgo-engine$extension" "src-tauri/binaries/texgo-engine-$TARGET$extension"
          npx tauri icon app-icon.svg
      - name: Test desktop integration on native platform
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Build desktop installer with bundled engine
        uses: tauri-apps/tauri-action@v1
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked --bin texgo-desktop
          uploadWorkflowArtifacts: false
          uploadUpdaterJson: false
      - name: Collect installers
        run: node scripts/collect-installers.mjs '${{ matrix.target }}' '${{ matrix.platform }}' '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop-installers/*
          if-no-files-found: error

  release:
    name: Publish Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-installers-*
          path: release
          merge-multiple: true
      - name: Generate checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          (cd release && sha256sum * > SHA256SUMS)
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="desktop-v${VERSION}-build.${BUILD_NUMBER}.${BUILD_ATTEMPT}"
          TITLE="Texgo ${VERSION} (build ${BUILD_NUMBER}.${BUILD_ATTEMPT})"
          LATEST=false
          if [[ "$REF_TYPE" == branch && "$REF_NAME" == main ]]; then LATEST=true; fi
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == "desktop-v${VERSION}" ]]; then
            TAG="$REF_NAME"
            TITLE="Texgo ${VERSION}"
            LATEST=true
          fi
          if [[ "$VERSION" == *-* ]]; then LATEST=false; fi
          flags=(--prerelease)
          if [[ "$LATEST" == true ]]; then flags=(); fi
          printf -v NOTES 'Commit: `%s`\n\nBuild: %s\n\nInstallers include both Texgo and the independent texgo-engine CLI/JSON-RPC API. macOS requires 13.3+. Windows is unsigned; macOS is ad-hoc signed and not notarized. SHA256SUMS covers every installer.' "$SHA" "$RUN_URL"
          gh release create "$TAG" release/* --target "$SHA" --draft --latest=false \
            --title "$TITLE" --notes "$NOTES" "${flags[@]}"
          gh release edit "$TAG" --draft=false --latest="$LATEST"

name: Desktop

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Verify frontend and engine
    if: github.event_name != 'push' || !github.event.deleted
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      latest: ${{ steps.version.outputs.latest }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check manifest, lockfile and release-tag versions
        id: version
        run: npm run version:check -- --github-output
      - run: npm run test:release
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true
      - name: Validate desktop dependency lock
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-cargo-lock
          path: desktop/src-tauri/Cargo.lock
      - run: npm ci
      - run: npm run check
      - run: npm run check:i18n
      - run: npm test
      - run: npm run test:pdf
      - run: cargo test --no-fail-fast --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features automation

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: verify
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-14
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-14
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            bundles: dmg
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true
          key: package-${{ matrix.target }}
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - name: Install frontend dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: resolved-cargo-lock
          path: desktop/src-tauri
      - name: Build bundled engine and prepare icons
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --locked --no-default-features --features automation --bin texgo-engine --target "$TARGET"
          extension=''
          if [ "$RUNNER_OS" = Windows ]; then extension='.exe'; fi
          mkdir -p src-tauri/binaries
          cp "src-tauri/target/$TARGET/release/texgo-engine$extension" "src-tauri/binaries/texgo-engine-$TARGET$extension"
          npx tauri icon app-icon.svg
      - name: Test desktop integration on native platform
        run: cargo test --no-fail-fast --manifest-path src-tauri/Cargo.toml --locked --features updater-tests --target ${{ matrix.target }}
      - name: Build desktop installer with bundled engine
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.verify.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --config '{"bundle":{"createUpdaterArtifacts":${{ needs.verify.outputs.publish }}}}' --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked --bin texgo-desktop
          uploadWorkflowArtifacts: false
          uploadUpdaterJson: false
      - name: Collect installers
        run: node scripts/collect-installers.mjs '${{ matrix.target }}' '${{ matrix.platform }}' '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop-installers/*
          if-no-files-found: error

  release:
    name: Publish Release
    if: needs.verify.outputs.publish == 'true'
    needs: [verify, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-installers-*
          path: release
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed updater artifacts and assemble feed
        run: node desktop/scripts/generate-updater-feed.mjs release
      - name: Generate checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          LATEST: ${{ needs.verify.outputs.latest }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          (cd release && sha256sum ./* > SHA256SUMS)
          CURRENT_SHA=$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha')
          if [[ "$CURRENT_SHA" != "$SHA" ]]; then
            echo 'Release tag moved after this build; refusing to publish.' >&2
            exit 1
          fi
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          printf 'Commit: %s\n\nBuild: %s\n\nInstallers include Texgo and the independent texgo-engine CLI/JSON-RPC API. macOS requires 13.3+. See the workflow for platform signing results; Windows installers are currently unsigned. SHA256SUMS covers every installer.' "$SHA" "$RUN_URL" > release-notes.md
          gh release create "$TAG" release/* --verify-tag --draft --latest=false \
            --title "Texgo $VERSION" --notes-file release-notes.md "${flags[@]}"
          gh release edit "$TAG" --draft=false --latest="$LATEST"

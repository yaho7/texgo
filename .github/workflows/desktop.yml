name: Desktop

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing unpublished version tag to rebuild (optional)
        type: string
        default: ''
      full_tests:
        description: Run full frontend and native regression suites
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release_tag == '' }}

jobs:
  verify:
    name: Check and prepare frontend
    if: github.event_name != 'push' || !github.event.deleted
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      latest: ${{ steps.version.outputs.latest }}
      sha: ${{ steps.version.outputs.sha }}
      ref: ${{ steps.version.outputs.ref }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    env:
      TEXGO_BUILD_REF: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check version and source identity
        id: version
        run: |
          node --input-type=module -e '
            import { checkVersions, writeGithubOutputs } from "./scripts/release-policy.mjs";
            const policy = await checkVersions(undefined, process.env.TEXGO_BUILD_REF);
            await writeGithubOutputs(policy, process.env.GITHUB_OUTPUT);
          '
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=$TEXGO_BUILD_REF" >> "$GITHUB_OUTPUT"
      - run: npm run test:release
      - run: npm ci
      - run: npm run check
      - run: npm run check:i18n
      - name: Full frontend regression (optional)
        if: inputs.full_tests == true
        run: npm test && npm run test:pdf
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.full_tests == true
      - uses: Swatinem/rust-cache@v2
        if: inputs.full_tests == true
        with:
          workspaces: desktop/src-tauri
      - name: Full headless regression (optional)
        if: inputs.full_tests == true
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features automation
      - name: Build frontend once
        if: steps.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: GITHUB_REF="$TEXGO_BUILD_REF" npm run build
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        with:
          name: frontend-dist
          path: desktop/dist
          retention-days: 3

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: verify
    if: needs.verify.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-14
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-14
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            bundles: app,dmg
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true
          cache-workspace-crates: true
          key: package-${{ matrix.target }}
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: desktop/dist
      - name: Build bundled engine and prepare icons
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --locked --no-default-features --features automation --bin texgo-engine --target "$TARGET"
          extension=''
          if [ "$RUNNER_OS" = Windows ]; then extension='.exe'; fi
          mkdir -p src-tauri/binaries
          cp "src-tauri/target/$TARGET/release/texgo-engine$extension" "src-tauri/binaries/texgo-engine-$TARGET$extension"
          npm exec -- tauri icon app-icon.svg
      - name: Native regression (optional)
        if: inputs.full_tests == true
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features updater-tests --target ${{ matrix.target }}
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.verify.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          PUBLISH: ${{ needs.verify.outputs.publish }}
        run: |
          rm -rf "src-tauri/target/$TARGET/release/bundle"
          npm exec -- tauri build --config "{\"build\":{\"beforeBuildCommand\":null},\"bundle\":{\"createUpdaterArtifacts\":$PUBLISH}}" --target "$TARGET" --bundles "$BUNDLES" -- --locked --bin texgo-desktop
      - name: Verify and collect installers
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TEXGO_BUILD_REF: ${{ needs.verify.outputs.ref }}
        run: |
          node --input-type=module -e '
            import { collectInstallers } from "./scripts/collect-installers.mjs";
            await collectInstallers({target:process.env.TARGET,platform:process.env.PLATFORM,arch:process.env.ARCH,ref:process.env.TEXGO_BUILD_REF});
          '
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop-installers/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish Release
    if: needs.verify.outputs.publish == 'true'
    needs: [verify, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-installers-*
          path: release
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed updater artifacts and assemble feed
        env:
          TEXGO_BUILD_REF: ${{ needs.verify.outputs.ref }}
        run: |
          node --input-type=module -e '
            import { generateUpdaterFeed } from "./desktop/scripts/generate-updater-feed.mjs";
            import { preparePublicAssets } from "./desktop/scripts/prepare-public-assets.mjs";
            const feed = await generateUpdaterFeed({directory:"release", desktop:"desktop", ref:process.env.TEXGO_BUILD_REF});
            await preparePublicAssets({directory:"release", version:feed.version});
          '
      - name: Publish eight release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          LATEST: ${{ needs.verify.outputs.latest }}
          SHA: ${{ needs.verify.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CURRENT_SHA=$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha')
          if [[ "$CURRENT_SHA" != "$SHA" ]]; then
            echo 'Release tag moved after this build; refusing to publish.' >&2
            exit 1
          fi
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          printf 'Commit: %s\n\nBuild: %s\n\nInstallers include Texgo and the independent texgo-engine CLI/JSON-RPC API. macOS requires 13.3+. See the workflow for platform signing results; Windows installers are currently unsigned. Five installers are provided; two macOS update archives and latest.json support signed in-app updates.' "$SHA" "$RUN_URL" > release-notes.md
          gh release create "$TAG" release/* --verify-tag --draft --latest=false \
            --title "Texgo $VERSION" --notes-file release-notes.md "${flags[@]}"
          gh release edit "$TAG" --draft=false --latest="$LATEST"
